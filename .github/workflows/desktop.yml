# Construit les installateurs de PhotoBook sur des machines Windows et macOS.
# Déclenchement : publication d'une étiquette « v0.3.0 », « v0.4.0 »… ou lancement manuel (onglet Actions).
# Résultat : une version GitHub en brouillon contenant les installateurs (.exe, .msi, .dmg).
name: Installateurs bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PhotoBook __VERSION__"
          releaseBody: "Installateurs PhotoBook. Windows : PhotoBook_x64-setup.exe. macOS : fichier .dmg."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
