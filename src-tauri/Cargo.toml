[package]
name = "photobook"
version = "0.3.0"
description = "PhotoBook — planches photo et collages automatiques (Fredy Photography)"
authors = ["Fredy Photography"]
edition = "2021"

[lib]
name = "photobook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
